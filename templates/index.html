<!DOCTYPE html>
<html lang="en"></html>
<head>
    <title>Student Score Predictor</title>

    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(rgba(5,25,60,0.45), rgba(5,25,60,0.55)),
                url("/static/whale.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .container{
            background: rgba(255,255,255,0.16);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.18);
            padding:40px;
            border-radius:24px;
            width:90%;
            max-width:380px;
            box-shadow:0 20px 40px rgba(0,0,0,0.25);
            color:white;
        }

        h1{
            text-align:center;
            margin-bottom:25px;

        }

        .subtitle{
            text-align:center;
            opacity:0.85;
            margin-top:-10px;
            margin-bottom:25px;
            font-size:14px;
        }
  
        label{
            font-weight:bold;
            display:block;
            margin-bottom:6px;
        }

        input{
            width:100%;
            padding:12px;
            border:none;
            border-radius:12px;
            margin-bottom:18px;
            box-sizing:border-box;
            font-size:16px;
            background:rgba(255,255,255,0.2);
            color:white;
            outline:none;
        }

        input:focus{
            background:rgba(255,255,255,0.3);
            box-shadow:0 0 12px rgba(20,184,166,0.5);
        }

        input::placeholder{
            color:rgba(255,255,255,0.7);
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#0d9488;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s ease;
        }

        button:hover{
            background:#0f766e;
            transform:translateY(-2px);
            box-shadow:0 8px 20px rgba(13,148,136,0.4);
        }

        #result{
            margin-top:20px;
            padding:15px;
            border-radius:12px;
            background:rgba(255,255,255,0.15);
            text-align:center;
            font-size:20px;
            font-weight:bold;
            border:1px solid rgba(255,255,255,0.2);
        }
    
    </style>

</head>

<body>

    <div class="container">

        <h1>🎓 Student Score Predictor</h1>
        <p class="subtitle">AI-powered score prediction using Machine Learning</p>

        <label>Hours Studied:</label>
        <input type="number" id="hours" placeholder="Enter study hours" min="0" max="24">

        <label>Attendance (%)</label>
        <input type="number" id="attendance" placeholder="Enter attendance" min="0" max="100">
        <button onclick="predictScore()">Predict Score</button>

        <p id="result"></p>

    </div>
    <script>
async function predictScore() {

    const hours = document.getElementById("hours").value;
    const attendance = document.getElementById("attendance").value;

    if (hours === "" || attendance === "") {
        document.getElementById("result").innerText =
            "⚠️ Please enter both values.";
        return;
    }

    const response = await fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            hours: Number(hours),
            attendance: Number(attendance)
        })
    });

    const data = await response.json();

    document.getElementById("result").innerText =
        "Predicted Score: " + data.predicted_score.toFixed(2);
}
</script>

</body>
</html>
